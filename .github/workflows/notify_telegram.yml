name: Notify Telegram after Linux CI

on:
  workflow_run:
    workflows: ["Linux."]
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'dev'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Send build result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat_id:
              sys.exit('Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret')

          result = os.environ['BUILD_RESULT']
          sha = os.environ['BUILD_SHA'][:7]
          text = f'tdesktop dev Linux CI: {result}\nCommit: {sha}\n{os.environ["BUILD_URL"]}'
          data = json.dumps({'chat_id': chat_id, 'text': text}).encode()
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data,
              headers={'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not json.load(response).get('ok'):
                      sys.exit('Telegram API did not accept the message')
          except urllib.error.HTTPError as error:
              sys.exit(f'Telegram API returned HTTP {error.code}')
          except urllib.error.URLError:
              sys.exit('Could not reach Telegram API')
          PY
