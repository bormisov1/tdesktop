name: Update channel.

# Builds a Linux release, packs it into a v2 update envelope signed with
# the channel Ed25519 key from Telegram/Resources/update/ and publishes it
# to the gh-pages branch that the clients of this fork poll:
#
#   https://bormisov1.github.io/tdesktop/current6
#   https://bormisov1.github.io/tdesktop/td-update-linux-x64-<version>
#
# The signing key is never stored in the repository: it lives in the
# UPDATE_CHANNEL_KEY secret and is only ever passed to the Packer through
# a file in the runner workspace.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version to publish, must be greater than the AppVersion of the source.'
        required: true
        type: string
      publish:
        description: 'Publish to gh-pages (otherwise a dry run that stops after packing).'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  ONLY_CACHE: "false"
  IMAGE_TAG: tdesktop:centos_env

jobs:
  update:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-release-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-release-

      - name: Generate a stub DesktopPrivate.
        run: |
          mkdir -p ../DesktopPrivate
          random_key() {
            printf -- '-----BEGIN RSA PRIVATE KEY-----\n%s\n-----END RSA PRIVATE KEY-----\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > ../DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > ../DesktopPrivate/alpha_private.h

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v $PWD/../DesktopPrivate:/usr/src/DesktopPrivate \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e KEEP_GOING=1 \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D DESKTOP_APP_SPECIAL_TARGET=linux \
          -D TDESKTOP_BUILD_UPDATE_TESTS=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: env.ONLY_CACHE == 'false'
        run: ccache --evict-older-than 3d

      - name: Save Telegram Desktop cache.
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Release/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Check the version.
        run: |
          APP_VERSION=$(sed -n 's/^constexpr auto AppVersion = \([0-9]*\);.*/\1/p' \
            Telegram/SourceFiles/core/version.h)
          echo "AppVersion in the sources: $APP_VERSION"
          if ! test "${{ inputs.version }}" -gt "$APP_VERSION"; then
            echo "The published version must be greater than AppVersion."
            exit 1
          fi

      - name: Verify the update trust chain.
        run: |
          # The same focused tests the canary release runs, against the
          # trust files committed in Telegram/Resources/update.
          out/Release/test_update_verify
          out/Release/test_update_unpack

      - name: Write the signing key.
        env:
          UPDATE_CHANNEL_KEY: ${{ secrets.UPDATE_CHANNEL_KEY }}
        run: |
          if test -z "$UPDATE_CHANNEL_KEY"; then
            echo "::error::The UPDATE_CHANNEL_KEY secret is not set."
            exit 1
          fi
          printf -- '%s\n' "$UPDATE_CHANNEL_KEY" > channel-private.pem
          chmod 600 channel-private.pem

      - name: Pack the update.
        run: |
          cd out/Release
          KEY_ID=$(python3 -c 'import json; \
            groups = json.load(open("../../Telegram/Resources/update/manifest.min.json")) \
              ["channels"]["stable"]; \
            assert len(groups) == 1, "the stable channel needs exactly one signature group"; \
            print(groups[0][0])')
          echo "Signing key id from the manifest: $KEY_ID"
          ./Packer -path Telegram -path Updater \
            -version ${{ inputs.version }} \
            -channel stable \
            -keys-loc ../../Telegram/Resources/update \
            -local-key ../../channel-private.pem \
            -local-key-id "$KEY_ID"
          shred -u ../../channel-private.pem

      - name: Write the feed.
        run: |
          cd out/Release
          PACKAGE=td-update-linux-x64-${{ inputs.version }}
          test -f "$PACKAGE"
          cat > current6 <<EOF
          {"linux":{"stable":{"released":${{ inputs.version }},"link":"$PACKAGE"}}}
          EOF
          cat current6

      - name: Upload the update package.
        uses: actions/upload-artifact@v7
        with:
          name: td-update-linux-x64-${{ inputs.version }}
          path: |
            out/Release/td-update-linux-x64-${{ inputs.version }}
            out/Release/current6
          if-no-files-found: error

      - name: Publish to gh-pages.
        if: inputs.publish
        run: |
          PACKAGE=td-update-linux-x64-${{ inputs.version }}
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$RUNNER_TEMP/pages"
          cd "$RUNNER_TEMP/pages"
          cp "$GITHUB_WORKSPACE/out/Release/$PACKAGE" .
          cp "$GITHUB_WORKSPACE/out/Release/current6" .
          echo "Published on $(date -u +%FT%TZ), version ${{ inputs.version }}." > VERSION
          git add --all
          git commit -m "publish $PACKAGE" || echo "Nothing to publish."
          git push